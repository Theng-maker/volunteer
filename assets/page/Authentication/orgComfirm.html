<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ស្ម័គ្រចិត្ត | បញ្ជាក់កូដ</title>
    <link rel="shortcut icon" href="../../image/logo-removebg.png" type="image/x-icon">
    <link rel="stylesheet" href="../../css/authentication.css">
    <link rel="stylesheet" href="../../css/bootstrap.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body class="authentication-body">
    <main>
        <section>
            <div class="container">
                <div class="row justify-content-center align-items-center">
                    <div class="col-12 col-xl-6 d-flex authentication-form">
                        <div class="login-img">
                            <img src="https://cdni.iconscout.com/illustration/premium/thumb/banking-app-login-illustration-svg-png-download-12202056.png"
                                alt="" class="img-fluid object-fit-contain h-100 w-100">
                        </div>
                        <div class="login-area">
                            <div class="section-title text-center">
                                <img src="../../image/logo-removebg.png" alt="Logo" class="logo mb-2">
                                <h2 class="mb-2">បញ្ជាក់គណនីអង្គការ</h2>
                                <p class="text-center w-100">
                                    សូមបញ្ចូលកូដដែលបានផ្ញើទៅអ៊ីមែលរបស់អ្នកដើម្បីបញ្ជាក់គណនីរបស់អ្នក។
                                </p>
                            </div>
                            <form id="orgCfForm" class="row gy-3" novalidate>
                                <div class="col-xl-12">
                                    <div>
                                        <label for="password" class="form-label">បញ្ចូលកូដ ៖</label>
                                        <input type="tel" class="form-control" id="password" placeholder="បញ្ចូលកូដ"
                                            value="1234" required>
                                        <div class="invalid-feedback">
                                            សូមបញ្ចូលកូដ
                                        </div>
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <button type="submit" class="btn btn-primary w-100 text-white">
                                        បញ្ជាក់គណនី
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>



    <script src="../../js/bootstrap.bundle.min.js"></script>
    <script src="../../js/main.js"></script>
</body>

</html>
