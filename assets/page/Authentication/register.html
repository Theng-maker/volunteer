<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ស្ម័គ្រចិត្ត | បង្កើតគណនី</title>
    <link rel="shortcut icon" href="../../image/logo-removebg.png" type="image/x-icon">
    <link rel="stylesheet" href="../../css/authentication.css">
    <link rel="stylesheet" href="../../css/bootstrap.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body class="authentication-body">
    <main>

        <section>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-xl-6">
                        <div class="login-area">
                            <div class="section-title text-center">
                                <img src="../../image/logo-removebg.png" alt="Logo" class="logo mb-3">
                                <h2>បង្កើតគណនីរបស់អ្នក</h2>
                            </div>
                            <form class="row gy-3 needs-validation" novalidate id="registerForm">
                                <div class="col-xl-6">
                                    <div>
                                        <label for="firstname" class="form-label">គោត្តនាម ៖</label>
                                        <input type="text" class="form-control" id="firstname"
                                            placeholder="បញ្ចូលគោត្តនាម" required>
                                        <div class="invalid-feedback">សូមបញ្ចូលគោត្តនាមរបស់អ្នក!</div>
                                    </div>
                                </div>

                                <div class="col-xl-6">
                                    <div>
                                        <label for="lastname" class="form-label">នាមខ្លួន ៖</label>
                                        <input type="text" class="form-control" id="lastname" placeholder="បញ្ចូលនាម"
                                            required>
                                        <div class="invalid-feedback">សូមបញ្ចូលនាមរបស់អ្នក!</div>
                                    </div>
                                </div>

                                <div class="col-xl-12">
                                    <div>
                                        <label for="email" class="form-label">អ៊ីមែល ៖</label>
                                        <input type="email" class="form-control" id="email" placeholder="បញ្ចូលអ៊ីមែល"
                                            required>
                                        <div class="invalid-feedback">សូមបញ្ចូលអ៊ីមែលត្រឹមត្រូវ!</div>
                                    </div>
                                </div>

                                <div class="col-xl-12">
                                    <div>
                                        <label for="password" class="form-label">ពាក្យសម្ងាត់ ៖</label>
                                        <input type="password" class="form-control" id="password"
                                            placeholder="បញ្ចូលពាក្យសម្ងាត់" required minlength="6">
                                        <div class="invalid-feedback">សូមបញ្ចូលពាក្យសម្ងាត់យ៉ាងហោចណាស់ 6 តួអក្សរ!</div>
                                    </div>
                                </div>

                                <div class="col-xl-12">
                                    <div>
                                        <div class="col-xl-12">
                                            <div>
                                                <input type="checkbox" class="form-check-input" id="exampleCheck1"
                                                    required>
                                                <label class="form-check-label" for="exampleCheck1">ចងចាំខ្ញុំ</label>
                                                <div class="invalid-feedback">សូមចាំសញ្ញាចុងខ្ញុំ!</div>
                                            </div>
                                        </div>

                                    </div>
                                </div>

                                <div class="col-xl-12">
                                    <button type="submit" class="btn btn-primary w-100">
                                        បង្កើតគណនី
                                    </button>

                                </div>
                                <div class="col-xl-12">
                                    <p class="text-center">
                                        មានគណនីរួចហើយ។
                                        <a href="login.html">
                                            ចូលគណនី
                                        </a>
                                    </p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>



    <script src="../../js/bootstrap.bundle.min.js"></script>
    <script src="../../js/main.js"></script>
    <script>

    </script>
</body>

</html>
