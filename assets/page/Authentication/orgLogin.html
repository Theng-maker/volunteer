<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ស្ម័គ្រចិត្ត | ចូលគណនី</title>
    <link rel="shortcut icon" href="../../image/logo-removebg.png" type="image/x-icon">
    <link rel="stylesheet" href="../../css/authentication.css">
    <link rel="stylesheet" href="../../css/bootstrap.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body class="authentication-body">
    <main>

        <section>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-xl-7 d-flex authentication-form">
                        <div class="login-img">
                            <img src="https://img.freepik.com/premium-vector/modern-illustration-mobile-phone-login-concept-with-modern-interface_1263357-37001.jpg" alt=""
                                class="img-fluid h-100">
                        </div>
                        <div class="login-area">
                            <div class="section-title text-center">
                                <img src="../../image/logo-removebg.png" alt="Logo" class="logo mb-3">
                                <h2>ចូលប្រើប្រាស់គណនីអង្គការ</h2>
                            </div>
                            <form id="orgloginForm" class="row gy-3 needs-validation" novalidate>
                                <div class="col-xl-12">
                                    <div>
                                        <label for="email" class="form-label">អ៊ីមែល ៖</label>
                                        <input type="email" class="form-control" id="email" placeholder="បញ្ចូលអ៊ីមែល"
                                            value="VolunteerCambo@gmail.com" required>
                                        <div class="invalid-feedback">សូមបញ្ចូលអ៊ីមែលត្រឹមត្រូវ។</div>
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <div>
                                        <label for="password" class="form-label">ពាក្យសម្ងាត់ ៖</label>
                                        <input type="password" class="form-control" id="password"
                                            placeholder="បញ្ចូលពាក្យសម្ងាត់" value="VolunteerCambo" required>
                                        <div class="invalid-feedback">សូមបញ្ចូលពាក្យសម្ងាត់។</div>
                                    </div>
                                </div>
                                <div class="col-xl-12 d-flex justify-content-between">
                                    <div>
                                        <input type="checkbox" class="form-check-input" id="exampleCheck1" checked
                                            required>
                                        <label class="form-check-label" for="exampleCheck1">ចងចាំខ្ញុំ</label>
                                        <div class="invalid-feedback">សូមចាំសញ្ញាចុងខ្ញុំ!</div>
                                    </div>
                                    <p class="text-center m-0">
                                        <a href="../Authentication/orgforget.html">ភ្លេចពាក្យសម្ងាត់?</a>
                                    </p>
                                </div>
                                <div class="col-xl-12">
                                    <button type="submit" class="btn btn-primary w-100 text-white">
                                        ចូលគណនី
                                    </button>
                                </div>
                                <div class="col-xl-12">
                                    <p class="text-center">
                                        មិនទាន់មានគណនីទេ?
                                        <a href="../Authentication/orgRegister.html">ចុះឈ្មោះ</a>
                                    </p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>



    <script src="../../js/bootstrap.bundle.min.js"></script>
    <script src="../../js/main.js"></script>
</body>

</html>
