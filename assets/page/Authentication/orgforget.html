<!DOCTYPE html>
<html lang="en"  data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ស្ម័គ្រចិត្ត | ភ្លេចពាក្យសម្ងាត់</title>
    <link rel="shortcut icon" href="../../image/logo-removebg.png" type="image/x-icon">
    <link rel="stylesheet" href="../../css/authentication.css">
    <link rel="stylesheet" href="../../css/bootstrap.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body class="authentication-body">
    <main>

        <section>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-xl-7 d-flex authentication-form">
                        <div class="login-img">
                            <img src="../../image/homepage/forget-img.jpg" alt=""
                                class="img-fluid object-fit-contain h-100 w-100">
                        </div>
                        <div class="login-area">
                            <div class="section-title text-center">
                                <img src="../../image/logo-removebg.png" alt="Logo" class="logo mb-3">
                                <h2 class="mb-2">ភ្លេចពាក្យសម្ងាត់អង្គការ</h2>
                                <p class="text-center w-100">

                                    យើងនឹងផ្ញើតំណភ្ជាប់សម្រាប់កំណត់ពាក្យសម្ងាត់ថ្មីទៅអ៊ីមែលរបស់អ្នក។
                                </p>
                            </div>
                            <form id="orgforgetForm" class="row gy-3 needs-validation" novalidate>
                                <div class="col-xl-12">
                                    <div>
                                        <label for="email" class="form-label">អ៊ីមែល ៖</label>
                                        <input type="email" class="form-control" id="email" placeholder="បញ្ចូលអ៊ីមែល"
                                            value="VolunteerCambo@gmail.com" required>
                                        <div class="invalid-feedback">សូមបញ្ចូលអ៊ីមែលត្រឹមត្រូវ។</div>
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <button type="submit" class="btn btn-primary w-100 text-white">
                                        ផ្ទៀងផ្ទាត់គណនី
                                    </button>
                                </div>
                                <div class="col-xl-12">
                                    <p class="text-center">
                                        ចូលគណនីផ្សេងទៀត?
                                        <a href="../Authentication/login.html">ចូលគណនី</a>
                                    </p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>



    <script src="../../js/bootstrap.bundle.min.js"></script>
    <script src="../../js/main.js"></script>
</body>

</html>
