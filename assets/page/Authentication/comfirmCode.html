<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ស្ម័គ្រចិត្ត | បញ្ជាក់កូដ</title>
    <link rel="shortcut icon" href="../../image/logo-removebg.png" type="image/x-icon">
    <link rel="stylesheet" href="../../css/authentication.css">
    <link rel="stylesheet" href="../../css/bootstrap.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <main>
        <section>
            <div class="container">
                <div class="row justify-content-center align-items-center">
                    <div class="col-xl-5">
                        <div class="login-area">
                            <div class="section-title text-center">
                                <img src="../../image/logo-removebg.png" alt="Logo" class="logo mb-3">
                                <h2>បញ្ជាក់គណនី</h2>
                                <p class="text-center w-100">
                                    សូមបញ្ចូលកូដដែលបានផ្ញើទៅអ៊ីមែលរបស់អ្នកដើម្បីបញ្ជាក់គណនីរបស់អ្នក។
                                </p>
                            </div>
                            <form id="passwordForm" class="row gy-3" novalidate>
                                <div class="col-xl-12">
                                    <div>
                                        <label for="password" class="form-label">បញ្ចូលកូដ ៖</label>
                                        <input type="password" class="form-control" id="password"
                                            placeholder="បញ្ចូលកូដ" required>
                                        <div class="invalid-feedback">
                                            សូមបញ្ចូលកូដ
                                        </div>
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <button type="submit" class="btn btn-primary w-100 text-white">
                                        បញ្ជាក់គណនី
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>



    <script src="../../js/bootstrap.bundle.min.js"></script>
    <script src="../../js/main.js"></script>
</body>

</html>
