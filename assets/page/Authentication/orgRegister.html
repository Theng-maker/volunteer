<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ស្ម័គ្រចិត្ត | អង្គការ</title>
    <link rel="shortcut icon" href="../../image/logo-removebg.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="../../css/authentication.css">
    <link rel="stylesheet" href="../../css/bootstrap.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body class="org-login authentication-body">
    <main>

        <section>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-xl-9 d-flex authentication-form">
                        <div class="login-img py-5">
                            <img src="https://w2r.co.in/assets/user/assets/img/login.png" alt=""
                                class="img-fluid h-100">
                        </div>
                        <div class="login-area org-register">
                            <div class="section-title text-center">
                                <img src="../../image/logo-removebg.png" alt="Logo" class="logo mb-1">
                                <h2>បង្កើតគណនីរបស់អង្គការ</h2>
                            </div>
                            <form id="orgRegisterForm" class="row gy-2 needs-validation" novalidate>
                                <div class="col-xl-12">
                                    <div>
                                        <label for="firstname" class="form-label">ឈ្មោះអង្គការ ៖</label>
                                        <input type="text" class="form-control" value="អង្គការមនុស្សធម៏ដើម្បីកម្ពុជា" id="firstname"
                                            placeholder="បញ្ចូលឈ្មោះអង្គការ" required>
                                        <div class="invalid-feedback">សូមបញ្ចូលឈ្មោះអង្គការ។</div>
                                    </div>
                                </div>
                                <div class="col-xl-6">
                                    <div>
                                        <label for="email" class="form-label">អ៊ីមែល ៖</label>
                                        <input type="email" class="form-control" value="CamVolunteer@gmail.com" id="email" placeholder="បញ្ចូលអ៊ីមែល"
                                            required>
                                        <div class="invalid-feedback">សូមបញ្ចូលអ៊ីមែលត្រឹមត្រូវ។</div>
                                    </div>
                                </div>
                                <div class="col-xl-6">
                                    <div>
                                        <label for="phone" class="form-label">លេខទូរស័ព្ទ ៖</label>
                                        <input type="tel" class="form-control" value="+855 683 828 00" id="phone"
                                            placeholder="បញ្ចូលលេខទូរស័ព្ទ" required>
                                        <div class="invalid-feedback">សូមបញ្ចូលលេខទូរស័ព្ទ។</div>
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <div>
                                        <label for="password" class="form-label">ពាក្យសម្ងាត់ ៖</label>
                                        <input type="password" class="form-control" value="SokryPes@123" id="password"
                                            placeholder="បញ្ចូលពាក្យសម្ងាត់" required>
                                        <div class="invalid-feedback">សូមបញ្ចូលពាក្យសម្ងាត់។</div>
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <div>
                                        <label for="password" class="form-label">ប្រភេទអង្គការ ៖</label>
                                        <select id="select-beast" placeholder="ជ្រើសរើសអង្គការ" autocomplete="on"
                                            class="w-100 form-control">
                                            <option value="">ជ្រើសរើសអង្គការ</option>
                                            <option value="4">អង្គការបរិស្ថាន</option>
                                            <option value="1">អង្គការសុខាភិបាល</option>
                                            <option value="3">អង្គការសហគមន៏</option>
                                            <option value="5">អង្គការមនុស្សធម៏</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="col-xl-12">
                                    <label for="file-input" class="form-label">រូបសញ្ញាអង្គការ ៖</label>
                                    <div class="wrapper">
                                        <div class="upload">
                                            <div class="border">
                                                <div class="icons fa-2x">
                                                    <i class="fas fa-file-image"></i>
                                                    <i class="fas fa-file-alt"></i>
                                                    <i class="fas fa-file-pdf"></i>
                                                </div>
                                                <p>
                                                    បញ្ចូលរូបសញ្ញាអង្គការ
                                                    <a href="#" id="file-browser">រុករក</a> កុំព្យូទ័ររបស់អ្នក
                                                </p>
                                                <input type="file" id="file-input" accept="image/*, .pdf, .doc,.docx">
                                                
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <div>
                                        <input type="checkbox" class="form-check-input"  id="exampleCheck1" checked required>
                                        <label class="form-check-label" for="exampleCheck1">លក្ខខណ្ឌ និង
                                            គោរពគោលការណ៏ឯកជន
                                        </label>
                                        <div class="invalid-feedback">ត្រូវតែយល់ព្រមមុនពេលបន្ត។</div>
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <button type="submit" class="text-white btn btn-primary w-100">
                                        បង្កើតគណនី
                                    </button>
                                </div>
                                <div class="col-xl-12">
                                    <p class="text-center">
                                        មានគណនីអង្គការរួចហើយ?
                                        <a href="../Authentication/orgLogin.html">ចូលគណនី</a>
                                    </p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>



    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
    <script src="../../js/bootstrap.bundle.min.js"></script>
    <script src="../../js/main.js"></script>
</body>

</html>
