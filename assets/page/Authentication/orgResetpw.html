<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ស្ម័គ្រចិត្ត | ផ្លាស់ប្តូរពាក្យសម្ងាត់</title>
    <link rel="shortcut icon" href="../../image/logo-removebg.png" type="image/x-icon">
    <link rel="stylesheet" href="../../css/authentication.css">
    <link rel="stylesheet" href="../../css/bootstrap.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body class="authentication-body">
    <main>

        <section>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-xl-7 d-flex authentication-form">
                        <div class="login-img">
                            <img src="https://shiptotal.in/CRM/assets/image/image_login.jpg" alt=""
                                class="img-fluid h-100">
                        </div>
                        <div class="login-area">
                            <div class="section-title text-center">
                                <img src="../../image/logo-removebg.png" alt="Logo" class="logo mb-3">
                                <h2>ផ្លាស់ប្តូរពាក្យសម្ងាត់អង្គការ</h2>
                            </div>
                            <form id="orgresetForm" class="row gy-3 needs-validation" novalidate>
                                <div class="col-xl-12">
                                    <div>
                                        <label for="password" class="form-label">ពាក្យសម្ងាត់ថ្មី ៖</label>
                                        <input type="password" class="form-control" id="password"
                                            placeholder="បញ្ចូលពាក្យសម្ងាត់ថ្មី" value="VolunteerCambo" required>
                                        <div class="invalid-feedback">សូមបញ្ចូលពាក្យសម្ងាត់ថ្មី។</div>
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <div>
                                        <label for="cf-password" class="form-label">បញ្ជាក់ពាក្យសម្ងាត់ថ្មី ៖</label>
                                        <input type="password" class="form-control" id="cf-password"
                                            placeholder="បញ្ជាក់ពាក្យសម្ងាត់ថ្មី" value="VolunteerCambo" required>
                                        <div class="invalid-feedback">សូមបញ្ជាក់ពាក្យសម្ងាត់ថ្មី។</div>
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <button type="submit" class="btn btn-primary w-100 text-white">
                                        ចូលគណនី
                                    </button>
                                </div>
                                <div class="col-xl-12">
                                    <p class="text-center">
                                        ចូលគណនីផ្សេងទៀត?
                                        <a href="login.html">
                                            ចូលគណនី
                                        </a>
                                    </p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>



    <script src="../../js/bootstrap.bundle.min.js"></script>
    <script src="../../js/main.js"></script>
</body>

</html>
