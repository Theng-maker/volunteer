<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ស្ម័គ្រចិត្ត | ចូលគណនី</title>
    <link rel="shortcut icon" href="../../image/logo-removebg.png" type="image/x-icon">
    <link rel="stylesheet" href="../../css/authentication.css">
    <link rel="stylesheet" href="../../css/bootstrap.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <main>

        <section>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-xl-5">
                        <div class="login-area">
                            <div class="section-title text-center">
                                <img src="../../image/logo-removebg.png" alt="Logo" class="logo mb-3">
                                <h2>ចូលប្រើប្រាស់គណនី</h2>
                            </div>
                            <form id="loginForm" class="row gy-2 gy-xl-3 needs-validation" novalidate>
                                <div class="col-xl-12">
                                    <div>
                                        <label for="email" class="form-label">អ៊ីមែល ៖</label>
                                        <input type="email" class="form-control" id="email" placeholder="បញ្ចូលអ៊ីមែល"
                                            required>
                                        <div class="invalid-feedback">សូមបញ្ចូលអ៊ីមែលត្រឹមត្រូវ។</div>
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <div>
                                        <label for="password" class="form-label">ពាក្យសម្ងាត់ ៖</label>
                                        <input type="password" class="form-control" id="password"
                                            placeholder="បញ្ចូលពាក្យសម្ងាត់" required>
                                        <div class="invalid-feedback">សូមបញ្ចូលពាក្យសម្ងាត់។</div>
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <p class="text-center m-0">
                                        <a href="../Authentication/forget.html">ភ្លេចពាក្យសម្ងាត់?</a>
                                    </p>
                                </div>
                                <div class="col-xl-12">
                                    <button type="submit" class="btn btn-primary w-100 text-white">
                                        ចូលគណនី
                                    </button>
                                </div>
                                <div class="col-xl-12">
                                    <p class="text-center">
                                        មិនទាន់មានគណនីទេ?
                                        <a href="../Authentication/register.html">ចុះឈ្មោះ</a>
                                    </p>
                                    <div class="d-flex align-items-start">
                                        <hr class="w-50 h-100">
                                        <span class="mx-2">ឬ</span>
                                        <hr class="w-50">
                                    </div>
                                </div>
                                <div class="col-xl-12">
                                    <ul
                                        class="login-list list-unstyled d-flex justify-content-center align-items-center">
                                        <li>
                                            <a href="../homepage.html" class="google-login d-flex align-items-center">
                                                <img src="../../image/Icon/facebook.png" alt="">
                                            </a>
                                        </li>
                                        <li>
                                            <a href="../homepage.html"
                                                class="google-login d-flex align-items-center mx-3">
                                                <img src="../../image/Icon/search.png" alt="">
                                            </a>
                                        </li>
                                        <li>
                                            <a href="../homepage.html" class="google-login d-flex align-items-center">
                                                <img src="../../image/Icon/github.png" alt="">
                                            </a>
                                        </li>
                                    </ul>
                                    <div class="d-flex align-items-start">
                                        <hr class="w-50 h-100">
                                        <span class="mx-2">ឬ</span>
                                        <hr class="w-50">
                                    </div>
                                    <p class="text-center">
                                        គណនីរបស់អង្គការមែនទេ?
                                        <a href="orgRegister.html">ចូលគណនី</a>
                                    </p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>



    <script src="../../js/bootstrap.bundle.min.js"></script>
    <script src="../../js/main.js"></script>
</body>

</html>
